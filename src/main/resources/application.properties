server.port=8888
server.address=0.0.0.0

spring.application.name=playlist-maker-backend

# Banco SQLite e Flyway
spring.datasource.url=${APP_DATABASE_URL:jdbc:sqlite:playlistmaker.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuracoes do Spotify
spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.redirect-uri=${APP_REDIRECT_URI:http://127.0.0.1:8888/api/auth/callback}
spotify.api-url=https://api.spotify.com
spotify.accounts-url=https://accounts.spotify.com
