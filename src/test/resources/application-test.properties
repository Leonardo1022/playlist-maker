spring.application.name=playlist-maker-backend-test

spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spotify.client-id=test-client-id
spotify.redirect-uri=http://127.0.0.1:8888/api/auth/callback
spotify.api-url=http://localhost:8089
spotify.accounts-url=http://localhost:8089
